# Activation token
activation-token.expiration-hours=24

# Scheduler
activation-token.cleanup.interval=6h

# URL documentation OpenAPI
quarkus.smallrye-openapi.path=/openapi

# Enable Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# JWT
jwt.expire-in=3600
jwt.verify.issuer=http://localhost:4200

# Keys
smallrye.jwt.sign.key.location=keys/privateKey.pem
mp.jwt.verify.publickey.location=keys/publicKey.pem